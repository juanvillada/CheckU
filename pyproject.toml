[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "checku"
authors = [{ name = "Juan C. Villada", email = "jvillada@lbl.gov" }]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["bioinformatics", "genome", "markers", "completeness", "microbiology", "quality"]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.19.2,<0.20",
    "pyhmmer>=0.12.0,<0.13",
    "pandas>=2.3.3,<3",
    "pyrodigal>=3.6.3.post1,<4",
]
dynamic = ["version", "description"]

[project.scripts]
checku = "checku.checku:app"

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda", "https://repo.prefix.dev/astrogenomics"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
checku = { path = ".", editable = true }

[tool.pixi.dependencies]
typer = ">=0.19.2,<0.20"
pyhmmer = ">=0.12.0,<0.13"
pandas = ">=2.3.3,<3"
pyrodigal = ">=3.6.3.post1,<4"

[tool.pixi.tasks]
checku = "python -m checku --help"
test = "python -m checku test --cpus 8"
