[workspace]
authors = ["Juan C. Villada <jvillada@lbl.gov>"]
channels = ["conda-forge", "bioconda", "https://repo.prefix.dev/astrogenomics"]
name = "checku"
platforms = ["linux-64"]
version = "0.1.2"

[tasks]
checku = { cmd = "python -m checku --help" }
test = { cmd = "python -m checku test --cpus 8" }


[dependencies]
python = ">=3.12,<3.13"
typer = ">=0.19.2,<0.20"
pyhmmer = ">=0.12.0,<0.13"
pandas = ">=2.3.3,<3"
pyrodigal = ">=3.6.3.post1,<4"
